[project]
name = "polymarket-copytrader"
version = "0.1.0"
description = "Observe-first Polymarket copy-trading MVP"
requires-python = ">=3.9"
dependencies = [
  "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
