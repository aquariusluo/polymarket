# newsyslog config for Polymarket CLI shadow monitor logs.
# Install by copying a rendered version (replace {{PROJECT_DIR}}) to:
#   /etc/newsyslog.d/com.aquariusluo.polymarket.cli-shadow.conf
#
# Format:
# <logfile> <owner:group> <mode> <count> <size> <when> <flags> [pid_file] [sig_num]
#
# Rotate at 1MB, keep 14 compressed archives.

{{PROJECT_DIR}}/tmp/polymarket-cli-shadow.out.log  root:wheel  644  14  1024  *  J
{{PROJECT_DIR}}/tmp/polymarket-cli-shadow.err.log  root:wheel  644  14  1024  *  J
{{PROJECT_DIR}}/tmp/polymarket-cli-monitor.jsonl   root:wheel  644  14  1024  *  J
